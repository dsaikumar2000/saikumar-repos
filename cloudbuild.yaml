steps:
  # Step 1: Install Terraform
  - name: hashicorp/terraform:1.6.0
    id: terraform-init
    entrypoint: sh
    args:
      - -c
      - |
        cd infra
        terraform init

  # Step 2: Validate Terraform
  - name: hashicorp/terraform:1.6.0
    id: terraform-validate
    entrypoint: sh
    args:
      - -c
      - |
        cd infra
        terraform validate

  # Step 3: Plan Terraform
  - name: hashicorp/terraform:1.6.0
    id: terraform-plan
    entrypoint: sh
    args:
      - -c
      - |
        cd infra
        terraform plan -input=false

  # Step 4: Apply Terraform (optional, usually gated)
  - name: hashicorp/terraform:1.6.0
    id: terraform-apply
    entrypoint: sh
    args:
      - -c
      - |
        cd infra
        terraform apply -auto-approve -input=false

# Optional: specify logs bucket or artifacts
options:
  logging: CLOUD_LOGGING_ONLY
